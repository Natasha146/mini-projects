<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card text-center" style="width: 20rem;">
      <div class="card-header">
        Tip Calculator
      </div>
      <div class="card-body">
        <label for="exampleFormControlInput1" class="form-label">Subtotal ($)</label>
        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="67.72">
        <label for="exampleFormControlTextarea1" class="form-label">Tip Percentage (as decimal,e.g. 0.2)</label>
        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3">0.2</textarea>
        <a href="#" class="btn btn-primary mt-3">Calculate Tip</a>
      </div>
      <div class="card-footer text-body-secondary">
        <p class="mb-1">Tip Amount: --</p>
        <p class="mb-0">Total Amount: --</p>
      </div>
    </div>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
